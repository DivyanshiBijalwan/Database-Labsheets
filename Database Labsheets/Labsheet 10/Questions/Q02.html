<!-- Q2: HTML medicine form -->
<!doctype html><html><head><title>Add Medicine</title></head><body><h1>Medicine Entry</h1><form method="post" action="/add">
<label>Medicine ID <input type="number" name="medicine_id" required></label>
<label>Medicine Name <input name="name" required></label><label>Category <input name="category" required></label>
<label>Price <input type="number" name="price" min="0" step="0.01" required></label>
<label>Stock <input type="number" name="stock" min="0" required></label>
<label>Manufacturer <input name="manufacturer" required></label><button>Submit</button></form></body></html>
