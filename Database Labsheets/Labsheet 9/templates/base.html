<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Record Management</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header><h1>Student Record Management System</h1>
<nav><a href="{{ url_for('home') }}">Home</a><a href="{{ url_for('add_student') }}">Add</a><a href="{{ url_for('view_students') }}">View</a><a href="{{ url_for('search_student') }}">Search</a><a href="{{ url_for('update_student') }}">Update</a></nav></header>
<main>
{% with messages = get_flashed_messages(with_categories=true) %}
{% for category, message in messages %}<p class="flash {{ category }}">{{ message }}</p>{% endfor %}
{% endwith %}
{% block content %}{% endblock %}
</main>
</body></html>
